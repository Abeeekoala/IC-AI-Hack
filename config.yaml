# VaxForge configuration (README section 5).
# Each stream edits ONLY its own section.  Relative paths resolve against this file's folder.
# Write floats with a dot (1.0e-5, not 1e-5) so PyYAML and the built-in reader agree.

# ======================================================================== shared (README)
pipeline:
  top_k: 20                         # candidates carried into S7 (CLI --top-k overrides)

thresholds:                         # stream B
  protegenicity: [0.90, 0.85]       # always report both
  allergenicity: 0.45               # AlgPred 2.0
  toxicity: 0.80                    # ToxinPred2
  conservancy_identity: 0.80

epitopes:                           # stream B
  bcell_tool: bepipred-3.0          # never 2.0
  mhc_class_ii_weight: 0.3          # down-weighted deliberately

structure:                          # stream B
  engine: boltz-2                   # MIT; do not switch to AF3 weights
  refolder: [esmfold, af2-no-msa]

reproducibility:                    # stream D
  seed: 20261114
  pin_versions: true

finetune:                           # stream D, README S9.5
  base_model_id: null               # unpinned: set from the live AutoScientist model list before training
  model_id: null                    # unpinned: exists only after a run; record run id + checkpoint SHA-256
  eval_tasks: 11                    # Text2WetLab: 11 tasks, 7 families, before the refusal filter
  seed: 20261114                    # bootstrap + any subsampling; Adaption's create request has no seed
  evidence: null                    # path to adaption_evidence.json: the stage attaches it (status evidence_attached)
  manifest: null                    # path to the training manifest.json (optional, with evidence)

# ======================================================================== stream A
paths:
  cache_dir: cache                  # gitignored; shared by every run
  runs_dir: runs                    # gitignored

cache:
  max_age_days: null                # null = never expire (reproducible). Set e.g. 90 to refresh quarterly.

network:
  offline: false                    # true = cache only, never touch the network (or VAXFORGE_OFFLINE=1)
  user_agent: "vaxforge/0.1 (hackathon research prototype)"
  timeout_s: 60
  retries: 3
  backoff_s: 1.5
  ncbi:
    tool: vaxforge
    email: null                     # NCBI asks for one: export NCBI_EMAIL=... (do not commit it)
    api_key: null                   # export NCBI_API_KEY=... lifts the limit from 3 to 10 requests/s

taxonomy:                           # S0
  search_retmax: 20
  genus_candidates: 15              # species listed when the name is a genus
  fuzzy: true                       # UniProt word search for old names / abbreviations
  aliases: {}                       # extra "alias": "Scientific name" pairs

acquire:                            # S1
  proteome:
    upid: auto                      # auto = UniProt reference proteome, or pin e.g. UP000000425
    fasta: null                     # path to your own protein FASTA (skips UniProt)
  comparison:                       # second strain, used by S4 conservancy
    enabled: true
    upid: auto
  vfdb:
    enabled: true                   # skipped automatically for non-bacteria
    set: A                          # A = experimentally verified core set, B = full set
    url_A: "http://www.mgc.ac.cn/VFs/Down/VFDB_setA_pro.fas.gz"
    url_B: "http://www.mgc.ac.cn/VFs/Down/VFDB_setB_pro.fas.gz"
  protegen:                         # experimentally verified protective antigens (needed by stream D)
    enabled: true
    category: all                   # all | bacterium | virus | parasite | fungus
    index_url: "https://violinet.org/protegen/download/index.php"
  human:                            # S4 autoimmunity screen
    enabled: true
    upid: UP000005640
    reviewed_only: true             # Swiss-Prot entries only (about 20k sequences)
  iedb:                             # large (hundreds of MB); off by default
    enabled: false
    url: "https://www.iedb.org/downloader.php?file_name=doc/mhc_ligand_full_single_file.zip"
  blastdb: true                     # run makeblastdb on the downloaded FASTA files

annotate:                           # S2
  vfdb:
    blast_evalue: 1.0e-3            # report weak hits too; calling a hit "virulence" uses the thresholds below
    max_hits: 5
    max_evalue: 1.0e-5              # ASSUMED defaults (README gives none) - tune and report them
    min_identity: 30.0
    min_query_coverage: 50.0
    strong_identity: 50.0
    strong_query_coverage: 80.0
    threads: 0                      # 0 = all CPUs
  psortb:
    mode: auto                      # auto | docker | native | import | "off"  (quote "off": YAML reads a bare off as false)
    gram: auto                      # auto (from S0 lineage) | negative | positive | archaea | positive_with_outer_membrane | negative_without_outer_membrane
    image: "brinkmanlab/psortb_commandline:1.0.2"
    timeout_s: 7200
  accessibility:                      # engineering judgement, not a literature claim
    Extracellular: accessible
    OuterMembrane: accessible
    Cellwall: accessible
    CytoplasmicMembrane: partial
    Periplasmic: inaccessible
    Cytoplasmic: inaccessible
    Unknown: unknown

tools:
  blast_bin_dir: null               # folder containing blastp / makeblastdb (default: PATH, or BLAST_BIN)
  docker: docker
  blast_image: "ncbi/blast:2.16.0"

# ======================================================================== stream C (S8 protocol, S9 robot code, S9+ animation, S10 animal study)
# Every key is optional and every value below is the built-in default (src/vaxforge/streamc_adapter.py, s8_protocol.py, s8_cost.py, s9_robot.py, s10_animal.py).
streamc:
  proteins: null                    # S2 stand-in: gene / entry name / accession / protein_id to carry into S8-S10; used ONLY when the run has no S3-S7 artifact
  top_k: 3                          # candidates taken from S7's final order (or from the stand-in list) into S8 and S10
  readouts: [elisa, rt_qpcr]        # S8 readout steps; elisa, rt_qpcr and facs are known
  endotoxin_limit_eu_per_ug: null   # S8 LAL release limit, EU/ug: a wet-lab decision, so no default (null prints "NOT YET SET")
  backend: template                 # S9 code generator: template (offline, deterministic), llm or both (needs the anthropic package and a key)
  model: null                       # S9 model id for backend llm / both (null: VAXFORGE_CODEGEN_MODEL, else the built-in default)
  simulate_runs: true               # S9: simulate every session in Opentrons 7.5.0; false leaves them UNVERIFIED (payload.status not_run)
  s12_status: pending               # S9: S12 biosecurity gate status copied into reports and file headers (pending or cleared)
  robot_params: {}                  # S9: overrides of RobotParams (volumes, times: all placeholders); {} keeps the defaults
  ot_python: null                   # S9: python with opentrons 7.5.0 (null: VAXFORGE_OT_PYTHON, else .venv-ot / .venv-wetlab)
  study: {}                         # S10: any StudyConfig field (species, goal, power, hla_transgenic_lines, ...); {} keeps the defaults
  prices: {}                        # S8 cost: unit prices YOU supply, item key -> {price, currency, unit}. None is built in: {} leaves the cost "not_estimated" (quantities still listed)
  #   Keys are exact and case-sensitive; the list of every key for a run is `payload.cost.items[].item` in s8_protocol.json. Quote a key that holds ': ' or '#'.
  #     gene_synthesis              unit: synthesis   one per shortlisted candidate
  #     robot_session               unit: session     one per S9 robot session
  #     tip:<tip rack load name>    unit: tip         e.g. tip:opentrons_96_tiprack_300ul (an 8-channel pick-up uses 8 tips)
  #     labware:<load name>         unit: item        e.g. labware:nest_96_wellplate_200ul_flat (tip racks are counted as tips; price reusable labware 0 or per use)
  #     reagent:<reagent name>      unit: uL, mL or L the name as the S9 plan writes it; the quantity is what the robot draws plus dead volume (the synthesised insert is gene_synthesis)
  #     animal                      unit: animal      total animals of the S10 design for the shortlist (only when S10's design can be computed)
  #   One currency for the whole table, as a 3-letter code (no conversion is done). A price of 0 says "counted elsewhere".
  #   The status is "estimated" only when EVERY item is priced; "partial" names the unpriced ones and gives no total. protocol.cost_gbp_range is set only for "estimated" in GBP.
  #   Shape of one entry:   "tip:opentrons_96_tiprack_300ul": {price: <number>, currency: <3-letter code>, unit: tip}
  s8_backend: template              # S8 step narratives: template (deterministic, offline) or llm (needs the anthropic package and a key; falls back to the template per step)
  s8_model: null                    # S8 model id for s8_backend llm (null: VAXFORGE_CODEGEN_MODEL, else the built-in default). An llm text may add no number, unit or control the step lacks
