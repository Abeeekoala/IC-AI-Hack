[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vaxforge"
version = "0.1.0"
description = "From a pathogen name to ranked candidate vaccine antigens, a falsifiable protocol and robot code (stream A: S0-S2)."
requires-python = ">=3.10"
# Stream A is stdlib-only except for PyYAML, which has a built-in fallback
# (config.py) so very new Pythons without wheels still work.
dependencies = ["PyYAML>=6; python_version < '3.15'", "pydantic>=2", "scipy"]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24"]
prediction = ["numpy>=1.24"]       # stream B: structure comparison (S5 AlphaFold check, S7); the stages still import and degrade without it

[project.scripts]
vaxforge = "vaxforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "validation/tests"]
addopts = "-q"
markers = [
    "network: test needs live internet (deselect with -m 'not network')",
    "blast: test needs a local BLAST+ install",
]
